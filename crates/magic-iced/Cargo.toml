[package]
name = "magic-iced"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Magic UI foundations for iced"
license = "MIT OR Apache-2.0"
authors = ["FerrisMind"]
repository = "https://github.com/FerrisMind/magic-iced"
readme = "README.md"
keywords = ["iced", "ui", "animation", "magic", "ferrismind"]
categories = ["gui", "rendering"]

[features]
default = []
tweet-adapter = ["dep:reqwest", "dep:serde", "dep:serde_json"]

[dependencies]
iced = { version = "0.14", features = ["advanced", "canvas", "image", "svg", "tokio", "tiny-skia"] }
iced_runtime = "0.14.0"
iced-shadcn = { path = "../../../shadcn-rs/crates/iced-shadcn" }
twill = { path = "../../../twill", features = ["iced"] }
unicode-segmentation = "1.12"
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
