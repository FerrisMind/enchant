[package]
name = "magic-iced"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Magic UI foundations for iced"
license = "MIT OR Apache-2.0"
authors = ["FerrisMind"]
repository = "https://github.com/FerrisMind/magic-iced"
readme = "README.md"
keywords = ["iced", "ui", "animation", "magic", "ferrismind"]
categories = ["gui", "rendering"]

[features]
default = []
tweet-adapter = ["dep:reqwest", "dep:serde", "dep:serde_json"]

[dependencies]
iced = { version = "0.14", features = ["advanced", "canvas", "image", "svg", "tokio", "wgpu"] }
bytemuck = { version = "1.24", features = ["derive"] }
iced_runtime = "0.14.0"
iced-shadcn = { git = "https://github.com/FerrisMind/shadcn-rs", rev = "3a50642e18d5c79c9e7ab5993c2325605ed18858", default-features = false }
lucide-icons = "0.575.0"
twill = { git = "https://github.com/FerrisMind/twill.git", rev = "d3419a53af2b20f7c1f7e4532a5ef3afa866229f", default-features = false, features = ["iced"] }
unicode-segmentation = "1.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
lyon_path = "1.0"
resvg = "0.45"
base64 = "0.22"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
