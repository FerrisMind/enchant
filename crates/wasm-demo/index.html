<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>magic-iced wasm demo</title>
    <link data-trunk rel="rust" href="Cargo.toml" data-bin="wasm-demo" data-wasm-opt="0" />
    <link data-trunk rel="copy-dir" href="assets" />
    <style>
        @font-face {
            font-family: 'Inter';
            src: url('assets/fonts/Inter/Inter-VariableFont_opsz,wght.ttf') format('truetype');
            font-weight: 100 900;
            font-display: swap;
        }

        @font-face {
            font-family: 'Geist';
            src: url('assets/fonts/Geist/Geist-VariableFont_wght.ttf') format('truetype');
            font-weight: 100 900;
            font-display: swap;
        }

        @font-face {
            font-family: 'Geist Mono';
            src: url('assets/fonts/Geist_Mono/GeistMono-VariableFont_wght.ttf') format('truetype');
            font-weight: 100 900;
            font-display: swap;
        }

        :root {
            color-scheme: light dark;
            background: #09090b;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #09090b;
            font-family: Geist, Inter, system-ui, sans-serif;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
            margin: 0;
            padding: 0;
            background: #09090b;
        }
    </style>
</head>
<body></body>
</html>
