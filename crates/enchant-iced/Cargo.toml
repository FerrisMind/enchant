[package]
name = "enchant-iced"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Magic UI-inspired premium interaction layer for iced"
documentation = "https://docs.rs/enchant-iced"
keywords = ["iced", "ui", "animation", "enchant", "ferrismind"]
categories = ["gui", "rendering"]

# Library sources + runtime assets only — examples/tests stay in git.
include = [
    "src/**/*",
    "assets/**/*",
    "Cargo.toml",
    "/README.md",
    "LICENSE*",
]

[features]
default = []
tweet-adapter = ["dep:reqwest", "dep:serde", "dep:serde_json"]
microphone = ["dep:cpal"]

[dependencies]
iced = { version = "0.14", features = ["advanced", "canvas", "image", "svg", "tokio", "wgpu"] }
bytemuck = { version = "1.24", features = ["derive"] }
iced_runtime = "0.14.0"
iced-shadcn = { version = "0.5.1", default-features = false, features = ["chrono"] }
lucide-icons = "0.575.0"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
twill = { version = "0.3", default-features = false, features = ["iced"] }
unicode-segmentation = "1.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
lyon_path = "1.0"
rayon = "1.12"
resvg = "0.45"
tiny-skia = "0.11"
base64 = "0.22"
swash = "0.2.9"
libm = "0.2"
cpal = { version = "0.16", optional = true }
# `primitive::Renderer` (draw_primitive) is not re-exported by `iced`; same version/features as iced's own.
iced_wgpu = { version = "0.14", default-features = false }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
serde_json = "1"
# Offline validation of the metal-fx WGSL (same naga wgpu uses).
naga = { version = "27", default-features = false, features = ["wgsl-in"] }

