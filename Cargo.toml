[workspace]
members = [
    "crates/enchant-iced",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
version = "0.29.0"
authors = ["FerrisMind"]
homepage = "https://github.com/FerrisMind/enchant-iced"
repository = "https://github.com/FerrisMind/enchant-iced"
description = "Magic UI-inspired premium interaction layer for iced"

[workspace.dependencies]
enchant-iced = { path = "crates/enchant-iced", version = "0.29.0" }

[profile.dev]
incremental = true
opt-level = 1
debug = 1

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false
